# Change "app" to a unique name before running `fly launch --copy-config`.
app = "family-chat-change-me"
primary_region = "ams"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
